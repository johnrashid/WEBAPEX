<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Choose Level</title>
  <link rel="stylesheet" href="reading.css">
  <link rel="stylesheet" href="design.css">
  <link rel="stylesheet" href="design.css">
  <style>
    /* Bibliography modal styles */
    #ref-modal { display: none; position: fixed; inset: 0; z-index: 9999; }
    #ref-modal .ref-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); }
    #ref-modal .ref-panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); background: #fff; color:#111; width: 90%; max-width:720px; max-height: 80vh; overflow:auto; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,0.25); padding:18px; }
    #ref-modal .ref-close { position:absolute; right:12px; top:8px; border:none; background:transparent; font-size:28px; line-height:1; cursor:pointer; }
    #ref-modal .ref-list ul { margin:0; padding-left:18px; }
    #ref-modal .ref-list li { margin:12px 0; }
    #ref-modal .ref-list a { color:#0b63c6; text-decoration:underline; }
  </style>
</head>
<body>

  <!-- Back button (fixed upper-left) -->
  <button type="button" class="back-btn" aria-label="Go back" onclick="handleBack()">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M20 11H7.83l5.58-5.59L12 4 4 12l8 8 1.41-1.41L7.83 13H20v-2z" fill="#fff"/>
    </svg>
  </button>

  <div class="wrapper">
    <div class="canvas">
      <!-- Levels view -->
      <section id="levels-view" class="intro" style="max-width:780px; text-align:center; display:block;">
        <h1 class="title">Choose a Level</h1>
        <div id="levels-list" class="levels">
          <button class="level-btn" data-level="1">Level 1</button>
          <button class="level-btn" data-level="2">Level 2</button>
          <button class="level-btn" data-level="3">Level 3</button>
          <button class="level-btn" data-level="4">Level 4</button>
          <button class="level-btn" data-level="5">Level 5</button>
        </div>
      </section>

      <!-- Stories view (populated dynamically) -->
      <section id="stories-view" class="intro" style="max-width:780px; text-align:center; display:none;">
        <h1 id="stories-title" class="title">Choose a Story</h1>
        <div id="stories-list" class="levels"></div>
      </section>

      <!-- References modal (hidden by default) -->
      <div id="ref-modal" style="display:none;">
        <div class="ref-overlay" id="ref-overlay"></div>
        <div class="ref-panel" role="dialog" aria-modal="true" aria-labelledby="ref-title">
          <button id="ref-close" class="ref-close" aria-label="Close">×</button>
          <h2 id="ref-title">References</h2>
          <div id="ref-list" class="ref-list"></div>
        </div>
      </div>

      <script>
        // Dynamic levels -> stories navigation (same behavior as on reading page)
        (function(){
          const levelsView = document.getElementById('levels-view');
          const levelsList = document.getElementById('levels-list');
          const storiesView = document.getElementById('stories-view');
          const storiesList = document.getElementById('stories-list');
          const storiesTitle = document.getElementById('stories-title');

          // mapping: level -> number of stories
          const levelCounts = { 1: 5, 2: 10, 3: 15, 4: 20, 5: 25 };

          // populate stories for a given level
          function populateStoriesForLevel(level) {
            const count = levelCounts[level] || 0;
            storiesList.innerHTML = '';
            for (let i = 1; i <= count; i++) {
              const sbtn = document.createElement('button');
              sbtn.className = 'level-btn story-card';
              sbtn.innerHTML = `<span class="story-badge">${i}</span><span class="story-label">Story ${i}</span>`;
              sbtn.addEventListener('click', () => {
                window.location.href = `story.html?level=${level}&story=${i}`;
              });
              storiesList.appendChild(sbtn);
            }
                      // add a Bibliography box for this level
              const refBtn = document.createElement('button');
              refBtn.className = 'level-btn story-card reference-card';
                      refBtn.innerHTML = `<span class="story-badge">Bib</span><span class="story-label">Bibliography</span>`;
              // show modal for Levels 1-5, use separate page for higher levels
              if (level >= 1 && level <= 5) {
                refBtn.addEventListener('click', () => {
                  showReferencesModal(level);
                });
              } else {
                refBtn.addEventListener('click', () => {
                  window.location.href = `references.html?level=${level}`;
                });
              }
              storiesList.appendChild(refBtn);
            storiesTitle.textContent = 'Level ' + level + ' - Choose a Story';
            levelsView.style.display = 'none';
            storiesView.style.display = 'block';
          }

          // delegate clicks on level buttons
          levelsList.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-level]');
            if (!btn) return;
            const level = Number(btn.getAttribute('data-level'));
            populateStoriesForLevel(level);
          });

          // If a `level` query param is present, open that level's stories directly
          (function(){
            const params = new URLSearchParams(location.search);
            const prelevel = params.get('level');
            if (prelevel) {
              populateStoriesForLevel(Number(prelevel));
            }
          })();

        })();

        // showReferencesModal: displays a modal with reference list for the given level

          const modal = document.getElementById('ref-modal');
          const overlay = document.getElementById('ref-overlay');
          const closeBtn = document.getElementById('ref-close');
          const title = document.getElementById('ref-title');
          const list = document.getElementById('ref-list');
          if (!modal || !list) return;
          title.textContent = 'Bibliography — Level ' + level;
          // attach close handlers if not already
          if (closeBtn && !closeBtn._refHandlerAttached){
            closeBtn.addEventListener('click', ()=>{ modal.style.display='none'; });
            closeBtn._refHandlerAttached = true;
          }
          if (overlay && !overlay._refHandlerAttached){
            overlay.addEventListener('click', ()=>{ modal.style.display='none'; });
            overlay._refHandlerAttached = true;

                <div><a href="https://i.pinimg.com/474x/77/4c/64/774c64d34b96207accc9350e9a03c32a.jpg" target="_blank">https://i.pinimg.com/474x/77/4c/64/774c64d34b96207accc9350e9a03c32a.jpg</a></div>

              </div>

                <div><a href="https://share.google/OzRJ8UlfMUkGLuIY7" target="_blank">https://share.google/OzRJ8UlfMUkGLuIY7</a></div>
              </div>
              <div class="ref-item" style="text-align:left; margin-top:12px;">
                <div><strong>Story 6.</strong> Newns, J. The Fox and the Woodcutter.</div>
                <div><a href="https://share.google/H0TiPY0r7utOtsBk4" target="_blank">https://share.google/H0TiPY0r7utOtsBk4</a></div>
              </div>
              <div class="ref-item" style="text-align:left; margin-top:12px;">

                <div><a href="https://share.google/kcb2tOGXLmAYgn66P" target="_blank">https://share.google/kcb2tOGXLmAYgn66P</a></div>

          } else if (level === 4) {
            list.innerHTML = `
