<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grammar Test - Adverbs</title>
  <link rel="stylesheet" href="pretest.css">
  <link rel="stylesheet" href="grammartest.css">
  <link rel="stylesheet" href="design.css">
</head>
<body>
  <button type="button" class="back-btn" onclick="history.back()" aria-label="Go back">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M20 11H7.83l5.58-5.59L12 4 4 12l8 8 1.41-1.41L7.83 13H20v-2z" fill="#fff"/>
    </svg>
  </button>
  <main class="canvas" role="main">
    <section id="intro" class="intro" style="max-width:780px; text-align:center;">
      <h1 class="title">Adverb Quiz</h1>
      <p class="subtitle">Identify adverbs and their functions.</p>
      <button id="start" class="next-btn">Start Quiz</button>
    </section>
    <div id="question-view" class="question" style="max-width:780px; text-align:center; display:none;">
      <div id="timer" style="position:relative; width:70px; height:70px; margin:0 auto 12px;">
        <svg width="70" height="70" style="transform:rotate(-90deg);">
          <circle cx="35" cy="35" r="30" fill="none" stroke="rgba(47,111,184,0.18)" stroke-width="4"/>
          <circle id="timer-circle" cx="35" cy="35" r="30" fill="none" stroke="url(#gradient)" stroke-width="4" stroke-dasharray="188.496" stroke-dashoffset="0" style="transition:stroke-dashoffset 1s linear;"/>
          <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#2f6fb8;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#6a3fc0;stop-opacity:1" />
            </linearGradient>
          </defs>
        </svg>
        <div id="timer-text" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:18px; font-weight:900; background:linear-gradient(135deg, #2f6fb8 0%, #6a3fc0 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">1:00</div>
      </div>
      <p id="q-text" class="q-text" style="font-size:24px; font-weight:800; color:#07101a; margin: 0 0 18px;"></p>
      <div id="choices" class="levels" style="gap:12px;"></div>
      <div id="feedback" class="feedback" aria-live="polite" style="margin-top:14px; font-weight:700;"></div>
      <button id="next-btn" class="next-btn" style="margin-top:18px; display:none;">Next</button>
    </div>
    <section id="completion" class="intro" style="max-width:780px; text-align:center; display:none;">
      <h2 class="title">Quiz Completed</h2>
      <p id="score" class="subtitle" style="font-size:22px;"></p>
    </section>
  </main>
  <script>
    const questions = [
      { q: '1. Riya ran to her mother _____.', choices: ['A. out','B. quickly','C. often','D. once'], correct: 1 },
      { q: '2. The scores are _____.', choices: ['A. before','B. out','C. pretty','D. forward'], correct: 1 },
      { q: '3. We have met _____.', choices: ['A. often','B. quickly','C. before','D. too'], correct: 2 },
      { q: '4. I know him _____ well.', choices: ['A. so','B. once','C. pretty','D. forward'], correct: 2 },
      { q: '5. The baby is _____ sleepy.', choices: ['A. somewhat','B. often','C. too','D. out'], correct: 0 },
      { q: '6. The naughty boy is _____ annoying.', choices: ['A. pretty','B. once','C. often','D. so'], correct: 0 },
      { q: '7. My aunt comes to visit us _____.', choices: ['A. too','B. before','C. often','D. forward'], correct: 2 },
      { q: '8. My grandpa is _____ better today.', choices: ['A. quickly','B. out','C. somewhat','D. once'], correct: 2 },
      { q: '9. I met a magician _____.', choices: ['A. often','B. once','C. too','D. pretty'], correct: 1 },
      { q: '10. Ambition urges us _____.', choices: ['A. before','B. once','C. out','D. forward'], correct: 3 }
    ];
    let index=0, score=0; let intenseAudio = null; let timeLeft = 60; let timerInterval = null;
    const intro=document.getElementById('intro');
    const startBtn=document.getElementById('start');
    const qView=document.getElementById('question-view');
    const qText=document.getElementById('q-text');
    const choicesEl=document.getElementById('choices');
    const feedback=document.getElementById('feedback');
    const nextBtn=document.getElementById('next-btn');
    const timerEl=document.getElementById('timer');
    const timerText = document.getElementById('timer-text');
    const timerCircle = document.getElementById('timer-circle');
    const totalTime = 60;
    const circumference = 2 * Math.PI * 30;
    const completion=document.getElementById('completion');
    const scoreEl=document.getElementById('score');
    function startTimer(){ timeLeft = 60; timerText.textContent = '1:00'; timerCircle.style.strokeDashoffset = '0'; if (timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { timeLeft--; const mins = Math.floor(timeLeft / 60); const secs = timeLeft % 60; timerText.textContent = mins + ':' + (secs < 10 ? '0' : '') + secs; const progress = (totalTime - timeLeft) / totalTime; timerCircle.style.strokeDashoffset = circumference * progress; if (timeLeft <= 0) { clearInterval(timerInterval); handleTimeout(); } }, 1000); }
    function handleTimeout(){ try { if (intenseAudio) { intenseAudio.pause(); intenseAudio.currentTime = 0; } } catch(e){} try { const buzzer = new Audio('wrong.mp3'); buzzer.play(); } catch(e){} const item = questions[index]; const all = choicesEl.querySelectorAll('button'); all.forEach(b => b.disabled = true); const buttons = Array.from(all); const correctBtn = buttons[item.correct]; if (correctBtn) correctBtn.classList.add('correct'); feedback.textContent = 'Time\'s up! The correct answer is ' + item.choices[item.correct] + '.'; feedback.style.color = '#c62828'; nextBtn.style.display = 'inline-block'; }
    function render(){ const item = questions[index]; qText.textContent = item.q; choicesEl.innerHTML = ''; feedback.textContent = ''; nextBtn.style.display = 'none'; try { intenseAudio = new Audio('intense.mp3'); intenseAudio.loop = true; intenseAudio.play(); } catch(e){} startTimer(); item.choices.forEach((label,i)=>{ const btn = document.createElement('button'); btn.className = 'level-btn choice-btn'; btn.textContent = label; btn.addEventListener('click', ()=>{ if (timerInterval) clearInterval(timerInterval); try { if (intenseAudio) { intenseAudio.pause(); intenseAudio.currentTime = 0; } } catch(e){} const all = choicesEl.querySelectorAll('button'); all.forEach(b=>b.disabled = true); const correctIndex = item.correct; const isCorrect = i === correctIndex; if (isCorrect) { btn.classList.add('correct'); feedback.textContent = 'Correct!'; feedback.style.color = '#0a8a0a'; score++; if (window && window.playPraiseKey) try{ window.playPraiseKey('correct'); }catch(e){} } else { btn.classList.add('wrong'); const buttons = Array.from(choicesEl.querySelectorAll('button')); const correctBtn = buttons[correctIndex]; if (correctBtn) correctBtn.classList.add('correct'); feedback.textContent = 'Incorrect. The correct answer is ' + item.choices[item.correct] + '.'; feedback.style.color = '#c62828'; try { const wrongAudio = new Audio('wrong.mp3'); wrongAudio.play(); } catch(e){} } nextBtn.textContent = index < questions.length - 1 ? 'Next' : 'Finish'; nextBtn.style.display = 'inline-block'; }); choicesEl.appendChild(btn); }); }
    startBtn.addEventListener('click', ()=>{ intro.style.display='none'; qView.style.display='block'; render(); });
    nextBtn.addEventListener('click', ()=>{ if (timerInterval) clearInterval(timerInterval); if(index<questions.length-1){ index++; render(); } else { qView.style.display='none'; completion.style.display='block'; scoreEl.textContent='You got '+score+' / '+questions.length; try{ const total = questions.length || 0; const pct = total ? (score/total)*100 : 0; if (window && window.playPraiseKey){ if (pct>=90) window.playPraiseKey('excellent'); else if (pct>=75) window.playPraiseKey('amazing'); else if (pct>=50) window.playPraiseKey('good job'); } }catch(e){} } });
  </script>
  <script src="audio.js" defer></script>
</body>
</html>
  </script>
</body>
</html>
