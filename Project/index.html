<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Web Apex - Index</title>
  <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="background.css">
    <link rel="stylesheet" href="design.css">
    <style>
      /* Index-specific: keep lightweight decorative background + floating words visible on small screens. */
      @media (max-width:420px){
        .floating-words{ display: block !important; }
        .floating-words .word{ opacity: 0.18 !important; filter: none !important; font-size: clamp(12px, 4.4vw, 26px) !important; }
        body::before{ background: radial-gradient(60% 40% at 50% 45%, rgba(255,255,255,0) 45%, rgba(255,255,255,0.04) 65%, rgba(9,8,20,0.02) 100%); }
      }
    </style>
</head>
<body>
  <div class="wrapper">
    <!-- floating words (decorative) -->
    <div class="floating-words">
      <span class="word" style="left:6%;  top:8%;   animation-duration:10s; animation-delay:-2s;">LEARN</span>
      <span class="word" style="left:24%; top:18%;  animation-duration:12s; animation-delay:-4s;">CREATE</span>
      <span class="word" style="left:62%; top:6%;   animation-duration:9s;  animation-delay:-1s;">EXPLORE</span>
      <span class="word" style="left:78%; top:26%;  animation-duration:11s; animation-delay:-3s;">BUILD</span>
      <span class="word" style="left:46%; top:44%;  animation-duration:13s; animation-delay:-5s;">UNDERSTAND</span>
      <span class="word" style="left:14%; top:56%;  animation-duration:14s; animation-delay:-6s;">PRACTICE</span>
      <span class="word" style="left:64%; top:60%;  animation-duration:10s; animation-delay:-2s;">PLAY</span>
      <span class="word" style="left:36%; top:72%;  animation-duration:12s; animation-delay:-4s;">GROW</span>
    </div>

  <!-- Username Modal -->
  <div id="usernameModal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2 style="margin-top: 0; color: #402688; text-align: center;">Enter Your Name</h2>
      <p style="text-align: center; color: #666; margin-bottom: 20px;">Your name will appear on the leaderboard</p>
      <input 
        type="text" 
        id="usernameInput" 
        placeholder="Enter your name" 
        maxlength="20"
        style="width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box;"
        autocomplete="off"
      />
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button id="skipUsername" class="modal-btn secondary" style="padding: 12px 24px; font-size: 16px; border-radius: 8px; border: 2px solid #ddd; background: white; color: #666; cursor: pointer;">
          Skip (Play as Guest)
        </button>
        <button id="confirmUsername" class="modal-btn primary" style="padding: 12px 24px; font-size: 16px; border-radius: 8px; border: none; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; cursor: pointer; font-weight: bold;">
          Start Playing
        </button>
      </div>
    </div>
  </div>

  <script src="audio.js" defer></script>
  <script>
    // Username modal functions
    function showUsernameModal() {
      document.getElementById('usernameModal').style.display = 'flex';
      document.getElementById('usernameInput').focus();
    }

    function hideUsernameModal() {
      document.getElementById('usernameModal').style.display = 'none';
    }

    function saveUsername() {
      const username = document.getElementById('usernameInput').value.trim();
      if (username) {
        localStorage.setItem('webapex_userName', username);
      } else {
        localStorage.setItem('webapex_userName', 'Guest');
      }
      location.href = 'home.html';
    }

    function skipUsername() {
      localStorage.setItem('webapex_userName', 'Guest');
      location.href = 'home.html';
    }

    // Event listeners
    document.addEventListener('DOMContentLoaded', function() {
      // Enter key on input
      document.getElementById('usernameInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          saveUsername();
        }
      });

      // Confirm button
      document.getElementById('confirmUsername').addEventListener('click', saveUsername);

      // Skip button
      document.getElementById('skipUsername').addEventListener('click', skipUsername);

      // Close modal when clicking outside
      document.getElementById('usernameModal').addEventListener('click', function(e) {
        if (e.target.id === 'usernameModal') {
          hideUsernameModal();
        }
      });
    });
  </script>

    <audio id="bg-audio" src="bgmusic.mp3" loop preload="auto" autoplay></audio>

<!-- Audio control (lower-right) -->
<div class="audio-control" aria-hidden="false">
    <button class="audio-btn" id="audio-toggle" aria-label="Toggle sound" title="Sound">
      <!-- speaker icon (svg) -->
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M3 10v4h4l5 5V5L7 10H3z" fill="currentColor"></path>
        <path class="wave" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.74 2.5-2.26 2.5-4.03z" fill="currentColor"></path>
      </svg>
    </button>

    <div class="audio-panel" id="audio-panel" aria-hidden="true">
      <input type="range" id="audio-volume" class="audio-volume" min="0" max="1" step="0.01" value="0.6" aria-label="Volume">
      <button id="audio-mute" class="audio-mute" aria-label="Mute">Mute</button>
    </div>
  </div>

  <!-- audio.js controls playback and UI; removed duplicate inline controller to avoid conflicts -->

    <div class="canvas">
      <!-- top image / logo -->
      <div class="circle"></div>

      <!-- welcome message -->
      <h1 class="title" style="text-align:center; margin-top:40px;">Welcome to Web Apex</h1>
      <h1 class="subtitle" style="text-align:center; margin-top:1px;">Where reading becomes winning.</h1>
      <!-- centered Play button (reuses .level-btn styling) -->
      <div class="play" style="top: calc(320px * var(--scale));">
        <button class="play-btn" onclick="showUsernameModal()"><span>PLAY</span></button>
      </div>
    </div>
      </div>

      </body>
    </html>
